# Builds the help website (npm run site) and deploys it to Azure Static Web Apps.
# One-off setup: create a Static Web App in Azure (deployment source "Other"), copy its deployment token,
# and add it to this repo as the secret AZURE_STATIC_WEB_APPS_API_TOKEN.
name: Website
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run site
      - name: Deploy to Azure Static Web Apps
        if: ${{ env.SWA_TOKEN != '' }}
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
      - name: Website not deployed
        if: ${{ env.SWA_TOKEN == '' }}
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: echo "::notice::Built the site; add the AZURE_STATIC_WEB_APPS_API_TOKEN secret to deploy it."
