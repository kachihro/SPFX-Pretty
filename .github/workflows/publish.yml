# Publishes SPFX Pretty to the VS Code Marketplace when a version tag is pushed (e.g. v0.9.6),
# or on demand. Uses Marketplace trusted publishing (OIDC) - no token or secret needed.
# One-off setup: marketplace.visualstudio.com/manage > Kachihro > Trusted Publishing, with a
# GitHub Actions policy for kachihro / SPFX-Pretty / publish.yml - see docs/PUBLISHING.md.
name: Publish to Marketplace
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # lets vsce get a GitHub OIDC token for trusted publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run publish-marketplace -- --oidc
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
