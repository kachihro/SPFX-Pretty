# Publishes SPFX Pretty to the VS Code Marketplace when a version tag is pushed (e.g. v0.9.0),
# or on demand. One-off setup: add a repository secret VSCE_PAT (Azure DevOps PAT,
# "All accessible organizations", scope Marketplace > Manage) - see docs/PUBLISHING.md.
name: Publish to Marketplace
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run publish-marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
